<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Around You</title>
<meta name="theme-color" content="#000000" />
<link rel="icon" href="/app-icon-512.png" />
<style>
  :root { --bg:#000; --green:#39ff14; --fg:#fff; --muted:#9aa09a; --line:#222; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding: calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px); }
  img { width:72px; height:72px; border-radius:16px; margin-bottom:20px; }
  h1 { font-size:1.6rem; margin:0 0 10px; }
  p { color:var(--muted); font-size:1rem; line-height:1.55; max-width:360px; margin:0 0 26px; }
  a.big { display:block; width:100%; max-width:340px; background:var(--green); color:#000; font-weight:800;
    text-decoration:none; padding:16px; border-radius:14px; font-size:1.1rem; margin-bottom:12px; }
  button.retry { width:100%; max-width:340px; background:transparent; color:var(--fg); border:2px solid var(--line);
    padding:14px; border-radius:14px; font-size:1rem; font-weight:600; }
</style>
</head>
<body>
  <img src="/app-icon-512.png" alt="Around You" />
  <h1>You're offline</h1>
  <p>Around You needs a connection to show live places near you. Your emergency numbers still work without signal.</p>
  <a class="big" href="/emergency.html">Emergency Numbers</a>
  <button class="retry" onclick="location.reload()">Try again</button>
</body>
</html>
