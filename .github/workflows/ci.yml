name: Backend CI

on:
  push:
    paths:
      - "app/**"
      - "internal/**"
      - "store/**"
      - "cmd/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "test.ps1"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "internal/**"
      - "store/**"
      - "cmd/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "test.ps1"

jobs:
  test:
    runs-on: ubuntu-latest

    # A disposable Postgres for this run only — never the real Supabase
    # project. Migrations (including the seed data) apply fresh every time,
    # so this doesn't need any manual setup beyond what's already in
    # migrations/*.sql.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aroundyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Start server
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/aroundyou_test?sslmode=disable"
          PORT: "4000"
        run: |
          go run ./cmd/server > server.log 2>&1 &
          echo $! > server.pid

          # Poll /ping instead of a fixed sleep — fails fast with the real
          # startup log if the server never comes up (e.g. a migration
          # error), rather than a generic timeout with no context.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/ping > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done

          echo "Server never became healthy. Log:"
          cat server.log
          exit 1

      - name: Run harness
        shell: pwsh
        run: ./test.ps1

      - name: Server log (always, for debugging)
        if: always()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
