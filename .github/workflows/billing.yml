name: Billing Run

# Triggers the billing run DAILY at 02:00 UTC (and on demand from the Actions
# tab). Running daily means each partner is invoiced on their own monthly
# anniversary — the day of the month they signed up — rather than everyone
# being batched to month-start. The run only bills subscriptions whose
# next_bill_date has arrived, and is idempotent, so daily runs are safe.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   BACKEND_URL         e.g. https://around-you-backend.fly.dev
#   BILLING_RUN_TOKEN   a long random string; the SAME value must be set as a
#                       Fly secret on the backend (fly secrets set BILLING_RUN_TOKEN=...)
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing run
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BILLING_RUN_TOKEN: ${{ secrets.BILLING_RUN_TOKEN }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/billing/run" \
            -H "X-Billing-Token: $BILLING_RUN_TOKEN"
