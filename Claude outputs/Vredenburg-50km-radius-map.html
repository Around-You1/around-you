<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vredenburg 50 km Radius</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#0d1b12; --lumo:#2fb24a; --panel:rgba(255,255,255,.94); }
  html,body{height:100%;margin:0}
  #map{position:absolute;inset:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .title{
    position:absolute;top:12px;left:12px;z-index:1000;background:var(--panel);
    padding:10px 14px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);
    border-left:5px solid var(--lumo);max-width:min(78vw,340px)
  }
  .title h1{margin:0 0 2px;font-size:16px}
  .title p{margin:0;font-size:12px;color:#44614e}
  .leaflet-tooltip.town{background:var(--lumo);color:#fff;border:none;font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .leaflet-tooltip.town:before{border-top-color:var(--lumo)}
</style>
</head>
<body>
<div class="title">
  <h1>Vredenburg — 50&nbsp;km radius</h1>
  <p>Western Cape, South Africa · centre 32.906°S, 17.996°E</p>
</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  var CENTRE = [-32.90639, 17.99583];
  var RADIUS_M = 50000;

  var map = L.map('map', { zoomControl: true, scrollWheelZoom: true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // 50 km ring
  var ring = L.circle(CENTRE, {
    radius: RADIUS_M,
    color: '#2fb24a',
    weight: 3,
    fillColor: '#2fb24a',
    fillOpacity: 0.08
  }).addTo(map);

  // centre marker
  L.marker(CENTRE).addTo(map)
    .bindTooltip('Vredenburg', { permanent: true, direction: 'top', className: 'town', offset: [0,-8] });

  // small reference points on the basemap (approximate)
  var refs = [
    ['Saldanha',      -33.0117, 17.9442],
    ['Langebaan',     -33.0908, 18.0300],
    ['Paternoster',   -32.8061, 17.8869],
    ['St Helena Bay', -32.7400, 18.0270],
    ['Jacobsbaai',    -32.9750, 17.8790],
    ['Hopefield',     -33.0650, 18.3500],
    ['Velddrif',      -32.7830, 18.1630]
  ];
  refs.forEach(function(r){
    L.circleMarker([r[1], r[2]], { radius:4, color:'#0d1b12', weight:1, fillColor:'#fff', fillOpacity:1 })
      .addTo(map).bindTooltip(r[0], { direction:'right', offset:[6,0] });
  });

  map.fitBounds(ring.getBounds(), { padding: [24,24] });
</script>
</body>
</html>
